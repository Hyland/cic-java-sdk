###############################################################################
# on-release-pr-merge.yml
#
# Trigger: on.push to main branch
#
# What it does:
#   1. Checks out main~1 (the release commit, before the dev-bump merge)
#   2. Extracts RELEASE_VERSION from pom.xml
#   3. Creates and pushes git tag v<RELEASE_VERSION>
#   4. Creates GitHub Release pointing to that tag
#
###############################################################################

name: Create Release and Tag on PR Merge

on:
  push:
    branches:
      - main
    paths:
      - pom.xml

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release Tag and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main~1 (release commit)
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main~1
          fetch-depth: 0

      - name: Check if this is a release commit
        id: gate
        run: |
          set -euo pipefail

          # Get the commit message from main~1 (the release commit)
          MSG=$(git log -1 --pretty=%B main~1)

          # Check if commit message matches release pattern
          if [[ "$MSG" =~ ^chore\(release\):\ set\ version\ to ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping: commit message does not match release pattern. Found: ${MSG:0:60}..."
          fi

      - name: Extract release version from pom.xml
        if: steps.gate.outputs.is_release == 'true'
        id: version
        run: |
          set -euo pipefail
          VERSION=$(mvn --quiet --file pom.xml exec:exec -Dexec.executable=echo -Dexec.args='${project.version}')

          # Skip if this is a SNAPSHOT or contains -SNAPSHOT (dev version)
          if [[ "${VERSION}" == *"-SNAPSHOT" ]]; then
            echo "::notice::Skipping: current version is SNAPSHOT (${VERSION}). Tag only on release versions."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release version: ${VERSION}"
          echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=true" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="v${{ steps.version.outputs.release_version }}"
          git tag -a "${TAG}" -m "Release ${{ steps.version.outputs.release_version }}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ steps.version.outputs.release_version }}"
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --title "Release ${{ steps.version.outputs.release_version }}"
