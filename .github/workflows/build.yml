name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  gather-context:
    name: Check if this is a release
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.gate.outputs.is_release }}
      release_version: ${{ steps.gate.outputs.release_version }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 2

      - name: Step back to previous commit
        run: git checkout HEAD~1

      - name: Check if this is a release commit
        id: gate
        run: |
          set -euo pipefail

          # Get the commit message from main~1 (the release commit)
          MSG=$(git log -1 --pretty=%B main~1)

          # Check if commit message matches release pattern
          if [[ "$MSG" =~ ^chore\(release\):\ set\ version\ to ]]; then
            VERSION=$(mvn --quiet --file pom.xml exec:exec -Dexec.executable=echo -Dexec.args='${project.version}')
        
            # Skip if this is a SNAPSHOT or contains -SNAPSHOT (dev version)
            if [[ "${VERSION}" == *"-SNAPSHOT" ]]; then
              echo "::notice::Skipping: current version is SNAPSHOT (${VERSION}). Tag only on release versions."
              echo "is_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release version: ${VERSION}"
              echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "is_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice::Skipping: commit message does not match release pattern. Found: ${MSG:0:60}..."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: gather-context
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(
          github.event_name == 'push'
          && '[{"name":"build","ref":"","deploy":true},{"name":"release","previous":"true","deploy":true}]'
          || (needs.gather-context.outputs.is_release == 'true'
              && '[{"name":"release","previous":"true","deploy":false}]'
              || '[{"name":"build","previous":"false","deploy":false}]')
          ) }}
    name: Run ${{ matrix.name }} ${{ case(matrix.name == 'release' && matrix.deploy == false, '(DRY RUN)', '') }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          lfs: true
          fetch-depth: ${{ matrix.previous && 2 || 1 }}

      - name: Step back to previous commit
        if: matrix.previous == true
        run: git checkout HEAD~1

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compile
        run: mvn --batch-mode -nsu install

      - name: Run E2E Tests against Staging
        if: ${{ !(github.event_name == 'push' && matrix.name == 'release') }} # skip e2e tests on release job for push events
        env:
          CIC_KE_CLIENT_ID: ${{ secrets.CIC_KE_CLIENT_ID }}
          CIC_KE_CLIENT_SECRET: ${{ secrets.CIC_KE_CLIENT_SECRET }}
          CIC_KE_BASE_URL: ${{ secrets.CIC_KE_BASE_URL }}
          CIC_KE_AUTH_URL: ${{ secrets.CIC_KE_AUTH_URL }}
          CIC_KE_DC_BASE_URL: ${{ secrets.CIC_KE_DC_BASE_URL }}
        run: |
          mvn --batch-mode -nsu verify -Pe2e -pl cic-ke -am

      - name: Build source/javadoc jars ${{ matrix.deploy == true && 'and deploy' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn --batch-mode -nsu source:jar javadoc:jar ${{ matrix.deploy == true && 'deploy' || '' }}

  create-release:
    name: Create Release Tag and GitHub Release
    runs-on: ubuntu-latest
    needs: [gather-context, build]
    if: github.event_name == 'push' && needs.gather-context.outputs.is_release == 'true'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 2

      - name: Step back to previous commit
        run: git checkout HEAD~1

      - name: Configure Git identity
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG="v${{ needs.gather-context.outputs.release_version }}"
          git tag -a "${TAG}" -m "Release ${{ needs.gather-context.outputs.release_version }}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ needs.gather-context.outputs.release_version }}"
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --title "Release ${{ needs.gather-context.outputs.release_version }}"

