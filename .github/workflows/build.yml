name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compile
        run: mvn --batch-mode -nsu install

      - name: Deploy to GitHub Packages
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn --batch-mode -nsu source:jar javadoc:jar deploy

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run E2E Tests against Staging
        env:
          CIC_KE_CLIENT_ID: ${{ secrets.CIC_CLIENT_ID }}
          CIC_KE_CLIENT_SECRET: ${{ secrets.CIC_CLIENT_SECRET }}
          CIC_KE_BASE_URL: ${{ secrets.CIC_BASE_URL }}
          CIC_KE_AUTH_URL: ${{ secrets.CIC_AUTH_URL }}
          CIC_KE_DC_BASE_URL: ${{ secrets.CIC_DC_BASE_URL }}
        run: |
          mvn --batch-mode -nsu verify -Pe2e -pl cic-ke -am
