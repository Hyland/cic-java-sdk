###############################################################################
# release.yml
#
# Trigger: Manual dispatch only (workflow_dispatch) with version inputs.
#
# What it does:
#   1. Validates RELEASE_VERSION (X.Y.Z) and computes the next dev version
#      (auto-incremented patch + -SNAPSHOT) unless one is provided.
#   2. Stamps RELEASE_VERSION across the root POM and all module POMs.
#   3. Builds + publishes artifacts (incl. source/javadoc jars) to GitHub Packages.
#   4. Commits, tags v<RELEASE_VERSION>, and pushes the tag.
#   5. Stamps the next development version on a branch and opens a PR to main.
#
###############################################################################

name: CIC Java SDK Release

on:
  workflow_dispatch:
    inputs:
      RELEASE_VERSION:
        description: "Version to release (e.g. 1.2.3 — X.Y.Z, no -SNAPSHOT)."
        required: true
        type: string
      DEVELOPMENT_VERSION:
        description: "Next development version (e.g. 1.2.4-SNAPSHOT). Leave empty to auto-increment the patch."
        required: false
        type: string
        default: ""

permissions:
  contents: write        # commit version bumps and push tags to the repo
  packages: write        # publish artifacts to GitHub Packages
  pull-requests: write   # open the next-development-version bump PR

jobs:
  release:
    name: Release v${{ inputs.RELEASE_VERSION }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
    steps:
      - name: Validate release version
        run: |
          set -euo pipefail
          # Accepts X.Y.Z or X.Y.Z-<alpha-label>.<number>
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z][A-Za-z0-9]*\.[0-9]+)?$ ]]; then
            echo "::error::RELEASE_VERSION '${RELEASE_VERSION}' is invalid. Must match X.Y.Z or X.Y.Z-<label>.<n> (e.g. 1.2.3 or 1.2.3-A.1)."
            exit 1
          fi
          echo "Release version ${RELEASE_VERSION} is valid."

      - name: Compute next development version
        id: dev-version
        env:
          DEVELOPMENT_VERSION: ${{ inputs.DEVELOPMENT_VERSION }}
        run: |
          set -euo pipefail
          if [[ -n "${DEVELOPMENT_VERSION}" ]]; then
            if [[ ! "${DEVELOPMENT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
              echo "::error::DEVELOPMENT_VERSION '${DEVELOPMENT_VERSION}' is invalid. Must match X.Y.Z-SNAPSHOT (e.g. 1.2.4-SNAPSHOT)."
              exit 1
            fi
            NEXT_DEV="${DEVELOPMENT_VERSION}"
            echo "Using provided next development version: ${NEXT_DEV}"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${RELEASE_VERSION}"
            NEXT_DEV="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
            echo "Auto-calculated next development version: ${NEXT_DEV}"
          fi
          echo "next_dev=${NEXT_DEV}" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Ensure tag does not already exist
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag '${TAG}' already exists on origin. Choose a different RELEASE_VERSION."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Configure Git identity
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: |
          set -euo pipefail
          mvn --batch-mode -nsu versions:set \
            -DnewVersion="${RELEASE_VERSION}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

      - name: Run E2E Tests against Staging (pre-release gate)
        env:
          CIC_KE_CLIENT_ID: ${{ secrets.CIC_KE_CLIENT_ID }}
          CIC_KE_CLIENT_SECRET: ${{ secrets.CIC_KE_CLIENT_SECRET }}
          CIC_KE_BASE_URL: ${{ secrets.CIC_KE_BASE_URL }}
          CIC_KE_AUTH_URL: ${{ secrets.CIC_KE_AUTH_URL }}
          CIC_KE_DC_BASE_URL: ${{ secrets.CIC_KE_DC_BASE_URL }}
        run: |
          set -euo pipefail
          mvn --batch-mode -nsu verify -Pe2e -pl cic-ke -am

      - name: Build and publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mvn --batch-mode -nsu source:jar javadoc:jar deploy

      - name: Commit release version
        uses: iarekylew00t/verified-bot-commit@42a042b0407248f3c0acac00c389e729e3476e86 # v2.3.5
        with:
          commit-message: "chore(release): set version to ${RELEASE_VERSION}"
          files: **/pom.xml
          if-no-commit: info

      - name: Set next development version
        run: |
          set -euo pipefail
          mvn --batch-mode -nsu versions:set \
            -DnewVersion="${{ steps.dev-version.outputs.next_dev }}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

      - name: Create pull request for next development version
        id: create-pr
        uses: peter-evans/create-pull-request@d867d14e79ea1b314e13f7e8d504702e5a1d1e74 # v5.1.0
        with:
          commit-message: "chore(release): set next development version ${{ steps.dev-version.outputs.next_dev }}"
          title: "chore(release): set next development version ${{ steps.dev-version.outputs.next_dev }}"
          body: |
            Automatically created by the release workflow.
            Updates development version to `${{ steps.dev-version.outputs.next_dev }}` after releasing v${{ inputs.RELEASE_VERSION }}.
          branch: "release/${{ inputs.RELEASE_VERSION }}/dev-bump"
          delete-branch: true

      - name: Output summary
        if: always()
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          NEXT_DEV="${{ steps.dev-version.outputs.next_dev }}"
          PR_URL="${{ steps.create-pr.outputs.pull-request-url }}"
          {
            echo "### Release v${RELEASE_VERSION}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Released version** | \`${RELEASE_VERSION}\` |"
            echo "| **Next dev version** | \`${NEXT_DEV:-_(not computed)_}\` |"
            echo "| **Published to** | GitHub Packages |"
            echo "| **Release PR** | ${PR_URL:-_(none — no changes needed)_} |"
            echo "| **Result** | ${STATUS} |"
            echo ""
            if [[ "${STATUS}" == "success" && -n "${PR_URL}" ]]; then
              echo "**Next step:** review and merge the PR. On merge, tag and GitHub Release will be created automatically."
            elif [[ "${STATUS}" == "success" ]]; then
              echo "**Next step:** no version bump PR was needed."
            else
              echo "**Next step:** fix the workflow failure and re-run the release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
