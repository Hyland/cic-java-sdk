###############################################################################
# release.yml
#
# Trigger: Manual dispatch only (workflow_dispatch) with version inputs.
#
# What it does:
#   1. Validates RELEASE_VERSION (X.Y.Z) and computes the next dev version
#      (auto-incremented patch + -SNAPSHOT) unless one is provided.
#   2. Stamps RELEASE_VERSION across the root POM and all module POMs.
#   3. Builds + publishes artifacts (incl. source/javadoc jars) to GitHub Packages.
#   4. Commits (via the GitHub GraphQL API, so the commit is verified/signed),
#      tags v<RELEASE_VERSION>, and pushes the tag.
#   5. Stamps the next development version and pushes it directly to main
#      (again via the GraphQL API, for a verified/signed commit).
#
###############################################################################

name: CIC Java SDK Release

on:
  workflow_dispatch:
    inputs:
      RELEASE_VERSION:
        description: "Version to release (e.g. 1.2.3 — X.Y.Z, no -SNAPSHOT)."
        required: true
        type: string
      DEVELOPMENT_VERSION:
        description: "Next development version (e.g. 1.2.4-SNAPSHOT). Leave empty to auto-increment the patch."
        required: false
        type: string
        default: ""

permissions:
  contents: write        # commit version bumps and push tags to the repo
  packages: write        # publish artifacts to GitHub Packages

jobs:
  release:
    name: Release v${{ inputs.RELEASE_VERSION }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
    steps:
      - name: Validate release version
        run: |
          set -euo pipefail
          # Accepts X.Y.Z or X.Y.Z-<alpha-label>.<number>
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z][A-Za-z0-9]*\.[0-9]+)?$ ]]; then
            echo "::error::RELEASE_VERSION '${RELEASE_VERSION}' is invalid. Must match X.Y.Z or X.Y.Z-<label>.<n> (e.g. 1.2.3 or 1.2.3-A.1)."
            exit 1
          fi
          echo "Release version ${RELEASE_VERSION} is valid."

      - name: Compute next development version
        id: dev-version
        env:
          DEVELOPMENT_VERSION: ${{ inputs.DEVELOPMENT_VERSION }}
        run: |
          set -euo pipefail
          if [[ -n "${DEVELOPMENT_VERSION}" ]]; then
            if [[ ! "${DEVELOPMENT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
              echo "::error::DEVELOPMENT_VERSION '${DEVELOPMENT_VERSION}' is invalid. Must match X.Y.Z-SNAPSHOT (e.g. 1.2.4-SNAPSHOT)."
              exit 1
            fi
            NEXT_DEV="${DEVELOPMENT_VERSION}"
            echo "Using provided next development version: ${NEXT_DEV}"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${RELEASE_VERSION}"
            NEXT_DEV="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
            echo "Auto-calculated next development version: ${NEXT_DEV}"
          fi
          echo "next_dev=${NEXT_DEV}" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Ensure tag does not already exist
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag '${TAG}' already exists on origin. Choose a different RELEASE_VERSION."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Configure Git identity
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: |
          set -euo pipefail
          mvn --batch-mode -nsu versions:set \
            -DnewVersion="${RELEASE_VERSION}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

      - name: Run E2E Tests against Staging (pre-release gate)
        env:
          CIC_KE_CLIENT_ID: ${{ secrets.CIC_KE_CLIENT_ID }}
          CIC_KE_CLIENT_SECRET: ${{ secrets.CIC_KE_CLIENT_SECRET }}
          CIC_KE_BASE_URL: ${{ secrets.CIC_KE_BASE_URL }}
          CIC_KE_AUTH_URL: ${{ secrets.CIC_KE_AUTH_URL }}
          CIC_KE_DC_BASE_URL: ${{ secrets.CIC_KE_DC_BASE_URL }}
        run: |
          set -euo pipefail
          mvn --batch-mode -nsu verify -Pe2e -pl cic-ke -am

      - name: Build and publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mvn --batch-mode -nsu source:jar javadoc:jar deploy

      - name: Commit release version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes — POMs already at ${RELEASE_VERSION}."
            exit 0
          fi

          # Commit via the GraphQL API (createCommitOnBranch) instead of a
          # plain `git commit` + push: commits created this way are signed
          # by GitHub itself, satisfying the repo's "Require signed commits"
          # rule without needing to manage a bot GPG key.
          HEAD_OID="$(git rev-parse HEAD)"
          ADDITIONS="[]"
          while IFS= read -r FILE; do
            CONTENT_B64="$(base64 -w0 "${FILE}")"
            ADDITIONS="$(jq -c --arg path "${FILE}" --arg contents "${CONTENT_B64}" \
              '. + [{path: $path, contents: $contents}]' <<< "${ADDITIONS}")"
          done < <(git diff --name-only --diff-filter=M)

          PAYLOAD="$(jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "main" \
            --arg oid "${HEAD_OID}" \
            --arg message "chore(release): set version to ${RELEASE_VERSION}" \
            --argjson additions "${ADDITIONS}" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, message: {headline: $message}, expectedHeadOid: $oid, fileChanges: {additions: $additions}}}}')"

          RESPONSE="$(echo "${PAYLOAD}" | gh api graphql --input -)"
          echo "${RESPONSE}" | jq .
          NEW_OID="$(echo "${RESPONSE}" | jq -r '.data.createCommitOnBranch.commit.oid // empty')"
          if [[ -z "${NEW_OID}" ]]; then
            echo "::error::Failed to create verified commit for the release version bump."
            exit 1
          fi
          echo "Created verified commit ${NEW_OID} on main."

          # Sync the local checkout so subsequent steps (tagging, next dev
          # version bump) build on top of the commit that now lives on main.
          git fetch origin main
          git reset --hard origin/main

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          git tag -a "${TAG}" -m "Release ${RELEASE_VERSION}"
          git push origin "refs/tags/${TAG}"

      - name: Set next development version
        run: |
          set -euo pipefail
          mvn --batch-mode -nsu versions:set \
            -DnewVersion="${{ steps.dev-version.outputs.next_dev }}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

      - name: Commit next development version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEXT_DEV="${{ steps.dev-version.outputs.next_dev }}"

          if git diff --quiet; then
            echo "No changes — POMs already at ${NEXT_DEV}; nothing to push."
            exit 0
          fi

          HEAD_OID="$(git rev-parse HEAD)"
          ADDITIONS="[]"
          while IFS= read -r FILE; do
            CONTENT_B64="$(base64 -w0 "${FILE}")"
            ADDITIONS="$(jq -c --arg path "${FILE}" --arg contents "${CONTENT_B64}" \
              '. + [{path: $path, contents: $contents}]' <<< "${ADDITIONS}")"
          done < <(git diff --name-only --diff-filter=M)

          PAYLOAD="$(jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "main" \
            --arg oid "${HEAD_OID}" \
            --arg message "chore(release): set next development version ${NEXT_DEV}" \
            --argjson additions "${ADDITIONS}" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, message: {headline: $message}, expectedHeadOid: $oid, fileChanges: {additions: $additions}}}}')"

          RESPONSE="$(echo "${PAYLOAD}" | gh api graphql --input -)"
          echo "${RESPONSE}" | jq .
          NEW_OID="$(echo "${RESPONSE}" | jq -r '.data.createCommitOnBranch.commit.oid // empty')"
          if [[ -z "${NEW_OID}" ]]; then
            echo "::error::Failed to create verified commit for the next development version bump."
            exit 1
          fi
          echo "Created verified commit ${NEW_OID} on main."

      - name: Output summary
        if: always()
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          NEXT_DEV="${{ steps.dev-version.outputs.next_dev }}"
          {
            echo "### Release v${RELEASE_VERSION}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Released version** | \`${RELEASE_VERSION}\` |"
            echo "| **Git tag** | \`v${RELEASE_VERSION}\` |"
            echo "| **Next dev version** | \`${NEXT_DEV:-_(not computed)_}\` |"
            echo "| **Published to** | GitHub Packages |"
            echo "| **Result** | ${STATUS} |"
            echo ""
            if [[ "${STATUS}" == "success" ]]; then
              echo "**Next step:** none — \`main\` has been updated to \`${NEXT_DEV}\` directly."
            else
              echo "**Next step:** fix the workflow failure and re-run the release (verify whether the tag exists before retrying)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
